{% extends "base.html" %}
{% block title %}{{ title }} | UniEvents{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4 text-center">
        <h1 class="h4">{{ title }}</h1>
        <p>{{ message }}</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn {{ confirm_class }}">{{ confirm_label }}</button>
          <a href="javascript:history.back()" class="btn btn-outline-secondary">Go back</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
